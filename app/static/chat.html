<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AI Appointment Assistant</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f3f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .chat-container {
            width: min(720px, 94vw);
            height: min(820px, 92vh);
            background: white;
            border-radius: 18px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.12);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            padding: 20px 24px;
            background: #202938;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .header-copy {
            min-width: 0;
        }

        .chat-header h1 {
            margin: 0;
            font-size: 22px;
        }

        .chat-header p {
            margin: 7px 0 0;
            font-size: 14px;
            opacity: 0.8;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .header-button {
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 10px;
            padding: 8px 12px;
            background: transparent;
            color: white;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
        }

        .header-button:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .header-button:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .header-button.stop-speaking {
            background: #dc2626;
            border-color: #dc2626;
        }

        .header-button.stop-speaking:hover {
            background: #b91c1c;
        }

        .voice-banner {
            padding: 10px 16px;
            font-size: 13px;
            line-height: 1.4;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .voice-banner.unsupported {
            background: #fffbe6;
            border-bottom: 1px solid #ffe58f;
            color: #873800;
        }

        .voice-banner.permission-denied {
            background: #fff2f0;
            border-bottom: 1px solid #ffccc7;
            color: #a8071a;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 22px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .message-row {
            display: flex;
        }

        .message-row.user {
            justify-content: flex-end;
        }

        .message-row.assistant {
            justify-content: flex-start;
        }

        .message {
            max-width: 78%;
            padding: 12px 16px;
            border-radius: 16px;
            line-height: 1.45;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .message-row.user .message {
            background: #202938;
            color: white;
            border-bottom-right-radius: 5px;
        }

        .message-row.assistant .message {
            background: #e9edf4;
            color: #1f2937;
            border-bottom-left-radius: 5px;
        }

        .message.error {
            background: #ffe1e1;
            color: #8b1e1e;
        }

        .typing {
            font-style: italic;
            opacity: 0.7;
        }

        .chat-form {
            border-top: 1px solid #e4e7ec;
            padding: 16px;
            display: flex;
            gap: 10px;
            background: white;
            align-items: center;
        }

        .chat-input {
            flex: 1;
            padding: 13px 15px;
            border: 1px solid #cbd2dc;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
        }

        .chat-input:focus {
            border-color: #202938;
        }

        .mic-button {
            border: 1px solid #cbd2dc;
            border-radius: 12px;
            padding: 13px 14px;
            background: #f8fafc;
            color: #334155;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .mic-button:hover:not(:disabled) {
            background: #f1f5f9;
            border-color: #94a3b8;
        }

        .mic-button.listening {
            background: #ef4444;
            color: white;
            border-color: #dc2626;
            animation: pulse-listening 1.5s infinite;
        }

        @keyframes pulse-listening {
            0% { opacity: 1; }
            50% { opacity: 0.75; }
            100% { opacity: 1; }
        }

        .send-button {
            border: none;
            border-radius: 12px;
            padding: 13px 22px;
            background: #202938;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .send-button:disabled,
        .mic-button:disabled,
        .chat-input:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        @media (max-width: 520px) {
            body {
                align-items: stretch;
            }

            .chat-container {
                width: 100%;
                height: 100vh;
                border-radius: 0;
            }

            .chat-header,
            .messages {
                padding-left: 16px;
                padding-right: 16px;
            }

            .message {
                max-width: 88%;
            }

            .send-button,
            .mic-button {
                padding: 11px 12px;
                font-size: 13px;
            }
        }
    </style>
</head>

<body>
    <main class="chat-container">
        <header class="chat-header">
            <div class="header-copy">
                <h1>AI Appointment Assistant</h1>
                <p>Ask about services, availability, or appointments.</p>
            </div>
            <div class="header-actions">
                <button
                    id="stop-speaking-button"
                    class="header-button stop-speaking"
                    type="button"
                    style="display: none;"
                >
                    Stop Speaking
                </button>

                <button
                    id="mute-button"
                    class="header-button"
                    type="button"
                >
                    Sound On
                </button>

                <button
                    id="new-chat-button"
                    class="header-button"
                    type="button"
                >
                    New chat
                </button>
            </div>
        </header>

        <div
            id="voice-banner"
            class="voice-banner"
            style="display: none;"
            role="alert"
        ></div>

        <section
            id="messages"
            class="messages"
            aria-live="polite"
        ></section>

        <form id="chat-form" class="chat-form">
            <input
                id="message-input"
                class="chat-input"
                type="text"
                placeholder="Type your message..."
                autocomplete="off"
                required
            >

            <button
                id="mic-button"
                class="mic-button"
                type="button"
            >
                Start Speaking
            </button>

            <button
                id="send-button"
                class="send-button"
                type="submit"
            >
                Send
            </button>
        </form>
    </main>

    <script>
        const messagesElement =
            document.getElementById("messages");

        const formElement =
            document.getElementById("chat-form");

        const inputElement =
            document.getElementById("message-input");

        const sendButton =
            document.getElementById("send-button");

        const newChatButton =
            document.getElementById("new-chat-button");

        const micButton =
            document.getElementById("mic-button");

        const muteButton =
            document.getElementById("mute-button");

        const stopSpeakingButton =
            document.getElementById("stop-speaking-button");

        const voiceBanner =
            document.getElementById("voice-banner");

        let threadId = getOrCreateThreadId();
        let isSending = false;
        let isListening = false;
        let isMuted = false;
        let activeVoiceBannerType = null; // 'unsupported' | 'permission_denied' | null
        let finalizedTranscript = ""; // accumulates finalized segments within one session
        let recognitionTimeout = null;  // safety auto-stop timer

        const SpeechRecognitionClass =
            window.SpeechRecognition || window.webkitSpeechRecognition;

        const isSpeechRecognitionSupported =
            Boolean(SpeechRecognitionClass);

        let recognition = null;

        if (isSpeechRecognitionSupported) {
            recognition = new SpeechRecognitionClass();
            recognition.continuous = false;
            recognition.interimResults = true;
            recognition.lang = "en-US";

            recognition.onstart = () => {
                isListening = true;
                finalizedTranscript = ""; // reset per session
                micButton.textContent = "Stop Listening";
                micButton.classList.add("listening");

                // Safety auto-stop: stop after 12 s of continuous listening.
                clearTimeout(recognitionTimeout);
                recognitionTimeout = setTimeout(() => {
                    if (isListening) {
                        try { recognition.stop(); } catch (e) {}
                    }
                }, 12000);

                if (activeVoiceBannerType === "permission_denied") {
                    clearVoiceBanner();
                }
            };

            recognition.onresult = (event) => {
                // Accumulate finalized segments; interim results are appended
                // separately so previously recognised words are never erased.
                let interimText = "";
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    if (event.results[i].isFinal) {
                        finalizedTranscript += event.results[i][0].transcript;
                    } else {
                        interimText += event.results[i][0].transcript;
                    }
                }
                const displayText = (finalizedTranscript + interimText).trim();
                if (displayText) {
                    inputElement.value = displayText;
                }
            };

            recognition.onerror = (event) => {
                isListening = false;
                clearTimeout(recognitionTimeout);
                resetMicButtonUI();

                if (
                    event.error === "not-allowed" ||
                    event.error === "service-not-allowed"
                ) {
                    showVoiceBanner(
                        "permission_denied",
                        "Microphone access was denied or unavailable. Please enable microphone permissions in your browser settings to use voice input."
                    );
                }
            };

            recognition.onend = () => {
                isListening = false;
                clearTimeout(recognitionTimeout);
                // Preserve the complete finalized transcript in the input.
                if (finalizedTranscript.trim()) {
                    inputElement.value = finalizedTranscript.trim();
                }
                resetMicButtonUI();
            };
        } else {
            showVoiceBanner(
                "unsupported",
                "Voice input is not supported in this browser. You can continue using text chat."
            );
            micButton.disabled = true;
            micButton.title = "Speech recognition is not supported in this browser.";
        }

        function showVoiceBanner(type, messageText) {
            activeVoiceBannerType = type;
            voiceBanner.className = `voice-banner ${type}`;
            voiceBanner.textContent = messageText;
            voiceBanner.style.display = "flex";
        }

        function clearVoiceBanner() {
            activeVoiceBannerType = null;
            voiceBanner.style.display = "none";
            voiceBanner.textContent = "";
            voiceBanner.className = "voice-banner";
        }

        function resetMicButtonUI() {
            if (!isSpeechRecognitionSupported) {
                micButton.disabled = true;
                return;
            }
            micButton.textContent = "Start Speaking";
            micButton.classList.remove("listening");
            micButton.disabled = isSending;
        }

        function stopListeningIfActive() {
            if (isListening && recognition) {
                try {
                    recognition.stop();
                } catch (e) {}
                isListening = false;
                resetMicButtonUI();
            }
        }

        function stopSpeakingIfActive() {
            if ("speechSynthesis" in window) {
                window.speechSynthesis.cancel();
            }
            stopSpeakingButton.style.display = "none";
        }

        function speakReply(text) {
            if (isMuted || !("speechSynthesis" in window) || !text) {
                return;
            }

            stopSpeakingIfActive();

            const cleanText = text
                .replace(/[*_#`~]/g, "")
                .trim();

            if (!cleanText) {
                return;
            }

            const utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.lang = "en-US";

            utterance.onstart = () => {
                stopSpeakingButton.style.display = "inline-block";
            };

            utterance.onend = () => {
                stopSpeakingButton.style.display = "none";
            };

            utterance.onerror = () => {
                stopSpeakingButton.style.display = "none";
            };

            window.speechSynthesis.speak(utterance);
        }

        micButton.addEventListener("click", () => {
            if (isSending || !isSpeechRecognitionSupported) {
                return;
            }

            if (isListening) {
                stopListeningIfActive();
            } else {
                stopSpeakingIfActive();
                try {
                    recognition.start();
                } catch (error) {
                    console.error("Failed to start speech recognition:", error);
                }
            }
        });

        muteButton.addEventListener("click", () => {
            isMuted = !isMuted;
            if (isMuted) {
                muteButton.textContent = "Muted";
                stopSpeakingIfActive();
            } else {
                muteButton.textContent = "Sound On";
            }
        });

        stopSpeakingButton.addEventListener("click", () => {
            stopSpeakingIfActive();
        });

        function getOrCreateThreadId() {
            const storedThreadId =
                localStorage.getItem(
                    "appointment_chat_thread_id"
                );

            if (storedThreadId) {
                return storedThreadId;
            }

            const newThreadId =
                crypto.randomUUID();

            localStorage.setItem(
                "appointment_chat_thread_id",
                newThreadId
            );

            return newThreadId;
        }

        function addMessage(
            content,
            sender,
            extraClass = ""
        ) {
            const row =
                document.createElement("div");

            const message =
                document.createElement("div");

            row.className =
                `message-row ${sender}`;

            message.className =
                `message ${extraClass}`.trim();

            message.textContent = content;

            row.appendChild(message);
            messagesElement.appendChild(row);

            messagesElement.scrollTop =
                messagesElement.scrollHeight;

            return row;
        }

        function setLoading(isLoading) {
            isSending = isLoading;
            inputElement.disabled = isLoading;
            sendButton.disabled = isLoading;
            newChatButton.disabled = isLoading;
            if (isSpeechRecognitionSupported) {
                micButton.disabled = isLoading;
            }
            sendButton.textContent = isLoading
                ? "Sending..."
                : "Send";
        }

        async function sendMessage(userMessage) {
            if (isSending) {
                return;
            }

            stopListeningIfActive();
            stopSpeakingIfActive();

            const requestId = crypto.randomUUID();

            addMessage(
                userMessage,
                "user"
            );

            const typingRow = addMessage(
                "Thinking...",
                "assistant",
                "typing"
            );

            setLoading(true);

            try {
                const response = await fetch(
                    "/ai/chat",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type":
                                "application/json"
                        },
                        body: JSON.stringify({
                            message: userMessage,
                            thread_id: threadId,
                            request_id: requestId
                        })
                    }
                );

                const responseBody =
                    await response.json();

                typingRow.remove();

                if (!response.ok) {
                    throw new Error(
                        responseBody.detail
                        ?? "The request failed."
                    );
                }

                const replyText =
                    responseBody.message
                    ?? responseBody.response;

                addMessage(
                    replyText,
                    "assistant"
                );

                speakReply(replyText);
            } catch (error) {
                typingRow.remove();

                addMessage(
                    "I couldn't reach the appointment assistant. "
                    + "Please check your connection and try again.",
                    "assistant",
                    "error"
                );
            } finally {
                setLoading(false);
                inputElement.focus();
            }
        }

        formElement.addEventListener(
            "submit",
            async (event) => {
                event.preventDefault();

                const userMessage =
                    inputElement.value.trim();

                if (!userMessage) {
                    return;
                }

                inputElement.value = "";

                await sendMessage(userMessage);
            }
        );

        newChatButton.addEventListener(
            "click",
            () => {
                if (isSending) {
                    return;
                }

                stopListeningIfActive();
                stopSpeakingIfActive();

                threadId = crypto.randomUUID();
                localStorage.setItem(
                    "appointment_chat_thread_id",
                    threadId
                );
                messagesElement.replaceChildren();
                addMessage(
                    "Hello! How can I help you with your appointment?",
                    "assistant"
                );
                inputElement.value = "";
                inputElement.focus();
            }
        );

        addMessage(
            "Hello! How can I help you with your appointment?",
            "assistant"
        );

        inputElement.focus();
    </script>
</body>
</html>
